name: Release build

# Builds the plugin for both Jellyfin lines with the ES5 compatibility layer
# (-p:JeEs5Build=true; a plain dotnet build leaves it out) and attaches the zips
# to the GitHub release when one is published. Run it manually to get the zips
# as workflow artifacts only.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # upload the zips to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jf10
            asset: Jellyfin.Plugin.JellyfinEnhanced_10.11.0.zip
          - target: jf12
            asset: Jellyfin.Plugin.JellyfinEnhanced_12.0.0.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Build
        run: >
          dotnet build Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj
          -c Release -p:JellyfinTarget=${{ matrix.target }} -p:JeEs5Build=true
          -o out
      - name: Check the ES5 compatibility layer is embedded
        run: |
          set -euo pipefail
          for name in es5.js.plugin.js.br es5.js.core.navigation.js.br es5.PluginPages.CalendarPage.html.br; do
            grep -aq "Jellyfin.Plugin.JellyfinEnhanced.$name" out/Jellyfin.Plugin.JellyfinEnhanced.dll \
              || { echo "::error::$name is missing from the DLL"; exit 1; }
          done
      - name: Package
        run: cd out && zip "../${{ matrix.asset }}" Jellyfin.Plugin.JellyfinEnhanced.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.asset }}
          retention-days: 30
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber
